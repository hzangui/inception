
services:
 
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    expose:
      - "3306"
    secrets:
     - db_password
     - db_root_password
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
 
  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    expose:
      - "9000"
    secrets:
      - db_password
      - wp_user_password
      - wp_admin_password
 
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    env_file:
      - .env
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    ports:
      - "443:443"

  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - inception
    depends_on:
      - mariadb
  
  redis:
    container_name: redis
    build: ./requirements/bonus/redis
    restart: always
    expose:
      - "6379"
    networks:
      - inception
  
  ftp:
    container_name: ftp
    build: ./requirements/bonus/ftp
    restart: always
    ports:
      - 21:21
      - 21000-21010:21000-21010
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    env_file: .env
    secrets:
      - ftp_password
    depends_on:
      - wordpress
  
  cadvisor:
    container_name: cadvisor
    build: ./requirements/bonus/cadvisor
    restart: always
    ports:
      - "9080:9080"
    networks:
      - inception
    env_file: .env
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
  
  static_site:
    container_name: static_site
    build: ./requirements/bonus/static_site
    restart: always
    ports:
      - "9090:9090"
    networks:
      - inception
 
networks:
  inception:
    driver: bridge
 
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password
  db_root_password:
    file: ../secrets/db_root_password
  wp_user_password:
    file: ../secrets/wp_user_password
  wp_admin_password:
    file: ../secrets/wp_admin_password
  ftp_password:
    file: ../secrets/wp_admin_password